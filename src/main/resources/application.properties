spring.application.name=alertaphishing-servicios

# Base de datos en memoria (H2) para desarrollo
spring.datasource.url=jdbc:h2:mem:alertaphishing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Internacionalización (i18n): español por defecto y English
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.web.locale=es

# Documentación OpenAPI (Swagger)
springdoc.swagger-ui.path=/swagger-ui.html
